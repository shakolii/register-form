<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم ثبت نام</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gray-500 flex item-center justify-center p-5">
    <form id="registerForm" class="w-full max-w-md bg-white p-5 rounded-xl space-y-4">
        <h1 class="text-2xl font-bold text-center">ثبت نام</h1>
        <input type="text" name="firstName" placeholder="نام" required class="w-full border rounded-lg p-3">
        <input type="text" name="lastName" placeholder="نام خانوادگی" required class="w-full border rounded-lg p-3">
        <input type="tel" name="phone" inputmode="numeric" placeholder="شماره موبایل" required
            class="w-full border rounded-lg p-3">
        <input type="email" name="email" placeholder="ایمیل" required class="w-full border rounded-lg p-3">
        <input type="password" name="password" placeholder="رمز عبور" required class="w-full border rounded-lg p-3">
        <input type="password" name="confirmPassword" placeholder="رمز عبور" required
            class="w-full border rounded-lg p-3">
        <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700">ورود</button>
    </form>
    <script type="module" src="scripts.ts"></script>
</body>
</html>
